name: careplus
description: "CarePlus - Health Tech Portfolio App (setState version, ready for BLoC/Riverpod migration)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3
  dio: ^5.11.0
  equatable: ^2.1.0
  fpdart: ^1.2.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^10.3.1
  flutter_bloc: ^9.1.1
  go_router: ^14.6.2
  get_it: ^9.2.1
  path_provider: ^2.1.6
  file_picker: ^12.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_background.png"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#2D9CDB"
  image: "assets/icon_foreground.png"
  android_12:
    color: "#2D9CDB"
    image: "assets/icon_foreground.png"
  android: true
  ios: false
  web: false
