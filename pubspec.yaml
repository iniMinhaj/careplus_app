name: careplus
description: "CarePlus - Health Tech Portfolio App (setState version, ready for BLoC/Riverpod migration)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3
  dio: ^5.11.0
  equatable: ^2.1.0
  fpdart: ^1.2.0
  connectivity_plus: ^7.3.1
  flutter_secure_storage: ^10.3.1
  flutter_bloc: ^9.1.1
  go_router: ^14.6.2
  get_it: ^9.2.1
  path_provider: ^2.1.6
  file_picker: ^11.0.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
